seed: 0
hyperparameters:
  hp_config.learning_rate:
    type: uniform_float
    upper: 0.1
    lower: 1.0e-06
    log: true
  hp_config.ent_coef:
    type: uniform_float
    upper: 0.5 
    lower: 0.0
    log: false
  hp_config.minibatch_size:
    type: categorical
    choices: [256, 512, 1024, 2048]
  hp_config.gae_lambda:
    type: uniform_float
    upper: 0.9999
    lower: 0.8
    log: false
  hp_config.vf_coef:
    type: uniform_float
    upper: 1.0
    lower: 0.0
    default: 0.5
    log: false
  hp_config.gamma_loss_rate:
    type: uniform_float
    upper: 0.05
    lower: 0.001
    default: 0.01
    log: True
  hp_config.n_steps:
    type: categorical
    choices: [2, 4, 8, 16, 32]
  hp_config.update_epochs:
    type: uniform_int
    upper: 20
    lower: 1
    log: False
  nas_config.num_mlp_layers:
    type: uniform_int
    upper: 3
    lower: 1
    log: False
  environment.n_envs:
    type: categorical
    choices: [256, 512, 1024, 2048, 5096]

